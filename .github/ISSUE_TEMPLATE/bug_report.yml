name: Bug report
description: Report reproducible behavior that differs from the documented or expected result.
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: >-
        Do not include API keys, wallet addresses you do not control, seed phrases,
        or other sensitive data. Use the security policy for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include app version/commit, OS, browser or mobile device, and paper/live mode. Redact secrets.
    validations:
      required: true
